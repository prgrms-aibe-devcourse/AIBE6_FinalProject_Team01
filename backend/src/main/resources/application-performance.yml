spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: performance
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/plamingo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s
  docker:
    compose:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: plamingo-backend
      environment: performance
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

logging:
  file:
    name: ${PERFORMANCE_LOG_PATH:build/performance-logs/backend.log}
  level:
    root: INFO
    back.backend: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      total-size-cap: 1GB

server:
  tomcat:
    mbeanregistry:
      enabled: true
    accesslog:
      enabled: true
      directory: ${PERFORMANCE_ACCESS_LOG_DIR:${user.dir}/build/performance-logs}
      prefix: access
      suffix: .log
      rotate: true
      pattern: '%t method=%m path=%U query=%q status=%s duration_us=%D bytes=%b'

app:
  performance:
    allow-external-apis: ${PERFORMANCE_ALLOW_EXTERNAL_APIS:false}
    seed:
      enabled: ${PERFORMANCE_SEED_ENABLED:true}
      member-count: ${PERFORMANCE_MEMBER_COUNT:1000}
      members-per-trip: ${PERFORMANCE_MEMBERS_PER_TRIP:10}
  file-storage:
    type: local
    upload-dir: ${PERFORMANCE_UPLOAD_DIR:build/performance-uploads}
  auth:
    test-accounts:
      enabled: true
  integrations:
    google-maps:
      api-key: ${PERFORMANCE_GOOGLE_MAPS_API_KEY:disabled}
      routes-api-key: ${PERFORMANCE_GOOGLE_ROUTES_API_KEY:disabled}
    openai:
      api-key: ${PERFORMANCE_OPENAI_API_KEY:disabled}
      base-url: ${PERFORMANCE_OPENAI_API_BASE_URL:http://127.0.0.1:9}
